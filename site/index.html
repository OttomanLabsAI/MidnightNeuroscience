const RECEPTORS = [
  'Acetylcholine',
  'Adrenergic',
  'Cannabinoid',
  'Dopamine',
  'GABA',
  'Glutamate',
  'Histamine',
  'Melatonin',
  'Muscarinic',
  'Neuropeptide',
  'Neuropeptide Y',
  'Noradrenaline',
  'Opioid',
  'Orexin',
  'Prostaglandin',
  'Serotonin',
  'Somatostatin'
];

// Plotly's default colorway, extended so receptor families with more than
// ten subtypes (e.g. serotonin) don't repeat colors ("large" palette).
const COLORWAY = [
  '#636efa', '#EF553B', '#00cc96', '#ab63fa', '#FFA15A',
  '#19d3f3', '#FF6692', '#B6E880', '#FF97FF', '#FECB52',
  '#AA0DFE', '#3283FE', '#85660D', '#782AB6', '#565656',
  '#1C8356', '#16FF32', '#F7E1A0', '#E2E2E2', '#1CBE4F',
  '#C4451C', '#DEA0FD', '#FE00FA', '#325A9B'
];

// Mirror of BrainMapping.ReceptorFilter: keep the columns whose name
// contains the receptor keyword (case-insensitive).
function receptorFilter(receptor) {
  const keyword = receptor.toLowerCase();
  return DATA.columns.filter(col => col.name.toLowerCase().includes(keyword));
}

// Mirror of graph_index_columns(df, barmode='group', chart_type='bar').
function updateGraph(receptor) {
  const traces = receptorFilter(receptor).map((col, i) => ({
    type: 'bar',
    name: col.name,
    x: DATA.structures,
    y: col.values,
    marker: { color: COLORWAY[i % COLORWAY.length] }
  }));

  Plotly.react('receptor-graph', traces, { barmode: 'group' }, { responsive: true });
}

const dropdown = document.getElementById('structure-dropdown');
for (const receptor of RECEPTORS) {
  const option = document.createElement('option');
  option.value = receptor;
  option.textContent = receptor;
  dropdown.appendChild(option);
}
dropdown.value = RECEPTORS[0]; // Default value, as in the Dash app
dropdown.addEventListener('change', () => updateGraph(dropdown.value));

updateGraph(dropdown.value);
</script>
