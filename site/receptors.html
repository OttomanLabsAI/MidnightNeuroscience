  /* Shared palette and header system — identical to the Region Atlas page */
  :root{
    --paper:#FFFFFF;
    --ink:#111111;
    --ink-60:#5A5A5A;
    --ink-35:#A9A9A9;
    --hair:#111111;
    --grid:#E2E2E2;

    --font-brand:'Flux','Afacad Flux',sans-serif;
    --font-serif:'Newsreader',Georgia,serif;
    --font-display:'Prata',Georgia,serif;

    /* the summed-total bar: a neutral at the palette's lightness, so it
       stays bright against paper and against ink */
    --total-fill:#D8D4CD;

    --wrap:1880px;
    --gap:14px;
  }

  /* dark mode — exact inverse of the default palette, site-wide */
  :root[data-theme="dark"]{
    --paper:#111111;
    --ink:#FFFFFF;
    --ink-60:#A9A9A9;
    --ink-35:#5A5A5A;
    --hair:#FFFFFF;
    --grid:#333333;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0 0 3rem;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 1rem;
    line-height: 1.62;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .wrap {
    max-width: var(--wrap);
    margin: 0 auto;
    padding-left: clamp(14px, 2.5vw, 48px);
    padding-right: clamp(14px, 2.5vw, 48px);
  }

  .masthead { text-align: center; padding: clamp(26px, 4vw, 44px) 0 0; }
  .masthead .brand { font-size: clamp(1.55rem, 4.6vw, 2.8rem); }
  .brand {
    display: inline-flex;
    align-items: flex-start;
    gap: .3em;
    font-family: var(--font-brand);
    font-weight: 500;
    font-size: clamp(2.3rem, 6vw, 3.7rem);
    line-height: 1;
    letter-spacing: .01em;
    color: var(--ink);
    text-decoration: none;
  }
  .brand:hover { text-decoration: none; }
  .brand .sparks { width: .55em; height: .55em; margin-top: -.05em; }
  .nav-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: .3rem clamp(1rem, 2.6vw, 2rem);
    padding: clamp(16px, 2.6vw, 26px) 0 clamp(14px, 2.2vw, 20px);
  }
  .nav-row a {
    font-family: var(--font-brand);
    font-weight: 500;
    font-size: .74rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
  }
  .nav-row a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .nav-row a[aria-current] { border-bottom: 2px solid var(--ink); padding-bottom: 2px; }

  .theme-toggle {
    font-family: var(--font-brand); font-weight: 500; font-size: .66rem;
    letter-spacing: .22em; text-transform: uppercase; color: var(--ink);
    background: none; border: 1px solid var(--hair); cursor: pointer;
    padding: .28rem .6rem; display: inline-flex; align-items: center; gap: .42rem;
  }
  .theme-toggle:hover { background: var(--ink); color: var(--paper); }
  .theme-toggle .th-dot {
    width: .66rem; height: .66rem; border: 1px solid currentColor; border-radius: 50%;
    background: linear-gradient(90deg, currentColor 0 50%, transparent 50% 100%);
  }

  /* title strip and select in the house voice, as on the Region Atlas */
  .title-strip {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: .5rem 1.3rem; border: 1px solid var(--hair);
    padding: .8rem 1rem; margin-bottom: var(--gap); text-align: center;
  }
  .title-strip .name {
    font-family: var(--font-display); font-size: 1.35rem;
    font-weight: 400; line-height: 1.05; letter-spacing: .02em; margin: 0;
  }
  .title-strip .anno {
    font-family: var(--font-serif); font-style: italic;
    font-size: .88rem; color: var(--ink-60);
  }
  .title-strip .ts-views { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: .5rem .9rem; margin-bottom: var(--gap);
  }

  'Acetylcholine',

// Bright, low-saturation fills that sit behind an ink outline, running in the
// familiar order: red, yellow, green, light blue, purple, orange, and on.
// Generated in OKLCH at one lightness and one chroma, so mostly only the hue
// changes down the list and no sub-type shouts louder than another; yellow
// alone is given a little more of both, since a desaturated yellow reads as
// khaki. Legible on paper and on ink alike.
const COLORWAY = [
  '#FEBDB4', '#EBD97C', '#AADFB0', '#9CD8FE',
  '#E1C0FA', '#F8C396', '#89E1E1', '#FCB9D5',
  '#B9CFFF', '#BFDB9F', '#FEBFA6', '#8CDEF2',
  '#F0BCEA', '#97E2C5', '#CCC8FF', '#E9CC8F'
];

// A couple of families are named for the neurotransmitter while the columns
// are named for the receptor: acetylcholine's are labelled nicotinic and
// muscarinic, so nothing would match on the family name alone.
const FAMILY_ALIASES = { 'Acetylcholine': ['nicotinic', 'muscarinic'] };

// Mirror of BrainMapping.ReceptorFilter: keep the columns whose name
// contains the receptor keyword (case-insensitive), plus any aliases.
function receptorFilter(receptor) {
  const keyword = receptor.toLowerCase();
  const aliases = FAMILY_ALIASES[receptor] || [];
  return DATA.columns.filter(col => {
    const name = col.name.toLowerCase();
    return name.includes(keyword) || aliases.some(a => name.includes(a));
  });
}

// Mirror of graph_index_columns(df, barmode='group', chart_type='bar') —
// a self-drawn grouped SVG bar chart, no charting library required.
const SVG_NS = 'http://www.w3.org/2000/svg';
const CHART = { height: 380, marginTop: 10, marginRight: 12, marginBottom: 108, marginLeft: 54 };

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
}

// Round a max value up to a clean axis ceiling (1/2/5 * 10^n).
function niceCeiling(value) {
  if (value <= 0) return 1;
  const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
  const norm = value / magnitude;
  const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return step * magnitude;
}

function formatTick(v) {
  return v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : String(Math.round(v));
}

// The chart reads two ways. "By Receptor" takes one receptor family across
// every brain structure; "By Region" transposes it, taking one structure
// across every receptor. Either way "subtype" draws a bar per receptor
// sub-type and "total" sums them.
let axisMode = 'structure';   /* 'structure' | 'region' */
let chartMode = 'subtype';    /* 'subtype'   | 'total'  */
let currentChart = { categories: [], series: [], legend: [] };

// The family a density column belongs to: the longest receptor name the column
// mentions, so "Neuropeptide Y" wins over "Neuropeptide".
function familyOf(colName) {
  const lower = colName.toLowerCase();
  let best = null;
  for (const r of RECEPTORS) {
    if (lower.includes(r.toLowerCase()) && (!best || r.length > best.length)) best = r;
  }
  if (!best) {
    for (const fam of Object.keys(FAMILY_ALIASES)) {
      if (FAMILY_ALIASES[fam].some(a => lower.includes(a))) return fam;
    }
  }
  return best;
}

const FAMILY_COLOR = {};
RECEPTORS.forEach((r, i) => { FAMILY_COLOR[r] = COLORWAY[i % COLORWAY.length]; });

// "5-HT1A Serotonin Receptor Density ..." reduces to "5-HT1A".
function shortLabel(colName, family) {
  if (family) {
    // Aliased families (acetylcholine) are not named in the column at all.
    const cut = colName.toLowerCase().indexOf(family.toLowerCase());
    const head = cut > 0 ? colName.slice(0, cut).trim() : '';
    if (head) return head;
  }
  return colName.replace(/\s*Receptor\s+Density.*$/i, '').trim() || colName;
}

function buildChart() {
  return axisMode === 'region'
    ? buildRegionChart(dropdown.value)
    : buildFamilyChart(dropdown.value);
}

// One receptor family, read across the brain structures.
function buildFamilyChart(receptor) {
  const categories = DATA.structures;
  const cols = receptorFilter(receptor);
  if (!cols.length) return { categories, series: [], legend: [] };

  if (chartMode === 'total') {
    const values = categories.map((_, r) =>
      cols.reduce((sum, col) => sum + (col.values[r] || 0), 0));
    return {
      categories,
      series: [{ name: 'Total ' + receptor + ' density', values, total: true }],
      legend: [{ name: 'Total ' + receptor + ' density', total: true,
                 note: 'sum of ' + cols.length + ' sub-types' }]
    };
  }
  const series = cols.map((col, i) => ({
    name: col.name, values: col.values, color: COLORWAY[i % COLORWAY.length]
  }));
  return { categories, series, legend: series.map(s => ({ name: s.name, color: s.color })) };
}

// One brain structure, read across the receptors — the transpose.
function buildRegionChart(structure) {
  const r = DATA.structures.indexOf(structure);
  if (r < 0) return { categories: [], series: [], legend: [] };

  if (chartMode === 'total') {
    const totals = new Map();
    for (const col of DATA.columns) {
      const fam = familyOf(col.name);
      if (!fam) continue;
      totals.set(fam, (totals.get(fam) || 0) + (col.values[r] || 0));
    }
    const categories = Array.from(totals.keys());
    return {
      categories,
      series: [{ name: 'Total density in ' + structure,
                 values: categories.map(f => totals.get(f)), total: true }],
      legend: [{ name: 'Total density in ' + structure, total: true,
                 note: 'summed within each of ' + categories.length + ' families' }]
    };
  }

  const categories = [], colors = [], values = [], labels = [], families = [];
  for (const col of DATA.columns) {
    const fam = familyOf(col.name);
    if (!fam) continue;
    categories.push(shortLabel(col.name, fam));
    colors.push(FAMILY_COLOR[fam]);
    values.push(col.values[r]);
    labels.push(col.name);
    if (!families.includes(fam)) families.push(fam);
  }
  return {
    categories,
    series: [{ name: structure, values, colors, labels }],
    legend: families.map(f => ({ name: f, color: FAMILY_COLOR[f] }))
  };
}

function redraw() {
  currentChart = buildChart();
  renderLegend(currentChart.legend);
  renderChart(currentChart);
}

function renderLegend(items) {
  document.getElementById('chart-legend').innerHTML = items.map(item =>
    '<span class="legend-item"><span class="legend-swatch' +
    (item.total ? ' swatch-total"' : '" style="background:' + item.color + '"') + '></span>' +
    escapeHtml(item.name) +
    (item.note ? ' <span class="legend-note">' + escapeHtml(item.note) + '</span>' : '') +
    '</span>').join('');
}

function renderChart(chart) {
  const container = document.getElementById('receptor-graph');
  const categories = chart.categories, series = chart.series;
  container.innerHTML = '';
  if (!series.length) {
    container.innerHTML = '<p class="table-note">No receptor sub-type data for this selection.</p>';
    return;
  }

  const single = series.length === 1;
  const totalMode = single && series[0].total;
  const groupCount = categories.length;
  const barGap = 2;
  const groupPad = 14;
  let barWidth = single ? 28 : 17;
  let groupWidth = Math.max(single ? 40 : 76, series.length * (barWidth + barGap) + groupPad);

  // Spread the groups to fill the container when the chart would leave dead
  // space; otherwise keep the natural width and let the container scroll.
  const room = Math.max(320, container.clientWidth) - CHART.marginLeft - CHART.marginRight;
  if (room / groupCount > groupWidth) {
    groupWidth = room / groupCount;
    barWidth = Math.min(single ? 46 : 26, (groupWidth - groupPad) / series.length - barGap);
  }
  const innerW = groupCount * groupWidth;
  const width = CHART.marginLeft + innerW + CHART.marginRight;
  const innerH = CHART.height - CHART.marginTop - CHART.marginBottom;

  const maxVal = niceCeiling(Math.max(...series.flatMap(s => s.values.filter(v => v != null))));
  const yOf = v => innerH - (v / maxVal) * innerH;

  const svg = svgEl('svg', {
    width, height: CHART.height, viewBox: `0 0 ${width} ${CHART.height}`,
    role: 'img', 'aria-label': axisMode === 'region'
      ? 'Receptor density within one brain structure, bar chart'
      : 'Receptor density by brain structure, bar chart'
  });
  const plot = svgEl('g', { transform: `translate(${CHART.marginLeft},${CHART.marginTop})` });

  const tickCount = 5;
  for (let i = 0; i <= tickCount; i++) {
    const v = (maxVal / tickCount) * i;
    const y = yOf(v);
    plot.appendChild(svgEl('line', { class: 'grid-line', x1: 0, x2: innerW, y1: y, y2: y, 'stroke-width': 1 }));
    const label = svgEl('text', { x: -8, y: y + 3, 'text-anchor': 'end', class: 'axis-label y-label' });
    label.textContent = formatTick(v);
    plot.appendChild(label);
  }
  plot.appendChild(svgEl('line', { class: 'axis-line', x1: 0, x2: innerW, y1: innerH, y2: innerH, 'stroke-width': 1 }));

  const tooltip = document.getElementById('chart-tooltip');
  const showTip = (evt, title, category, value) => {
    tooltip.innerHTML = '<div class="tt-series">' + escapeHtml(title) + '</div>' +
      escapeHtml(category) + ': <span class="tt-value">' +
      Math.round(value).toLocaleString() + ' fmol/mg</span>';
    tooltip.style.display = 'block';
    moveTip(evt);
  };
  const moveTip = (evt) => {
    const x = (evt.touches ? evt.touches[0].clientX : evt.clientX);
    const y = (evt.touches ? evt.touches[0].clientY : evt.clientY);
    tooltip.style.left = Math.min(x + 14, window.innerWidth - 270) + 'px';
    tooltip.style.top = Math.max(y - 40, 8) + 'px';
  };
  const hideTip = () => { tooltip.style.display = 'none'; };

  categories.forEach((category, gi) => {
    const groupX = gi * groupWidth + (groupWidth - (series.length * (barWidth + barGap) - barGap)) / 2;
    series.forEach((s, ci) => {
      const v = s.values[gi];
      if (v == null) return;
      const x = groupX + ci * (barWidth + barGap);
      const y = yOf(v);
      const rect = svgEl('rect', {
        class: s.total ? 'bar bar-total' : 'bar',
        x, y, width: barWidth, height: Math.max(0, innerH - y)
      });
      if (!s.total) rect.setAttribute('fill', s.colors ? s.colors[gi] : s.color);
      const title = s.labels ? s.labels[gi] : s.name;
      const named = s.labels ? s.name : category;
      rect.addEventListener('mouseenter', e => showTip(e, title, named, v));
      rect.addEventListener('mousemove', moveTip);
      rect.addEventListener('mouseleave', hideTip);
      rect.addEventListener('touchstart', e => showTip(e, title, named, v), { passive: true });
      plot.appendChild(rect);
    });

    const labelX = gi * groupWidth + groupWidth / 2;
    const label = svgEl('text', {
      class: 'axis-label x-label', 'text-anchor': 'end',
      transform: `translate(${labelX},${innerH + 12}) rotate(-38)`
    });
    label.textContent = category;
    plot.appendChild(label);
  });

  svg.appendChild(plot);
  container.appendChild(svg);
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!panes.chart.classList.contains('hidden')) renderChart(currentChart);
  }, 150);
});

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Display a 'min:max' range with an en dash; single values pass through.
function formatRange(raw) {
  const m = /^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/.exec(raw);
  return m ? m[1] + '–' + m[2] : raw;
}

// The density data as a table, following the same orientation as the chart.
function renderDensityTable() {
  if (axisMode === 'region') { renderRegionTable(dropdown.value); return; }
  const receptor = dropdown.value;
  const cols = receptorFilter(receptor);
  const wrap = document.getElementById('density-table');
  if (!cols.length) {
    wrap.innerHTML = '<p class="table-note">No receptor sub-type data for ' +
      escapeHtml(receptor) + '.</p>';
    return;
  }
  let html = '<table class="data-table"><thead><tr><th>Brain Structure</th>';
  for (const col of cols) html += '<th>' + escapeHtml(col.name) + '</th>';
  html += '</tr></thead><tbody>';
  DATA.structures.forEach((structure, r) => {
    html += '<tr><td class="name">' + escapeHtml(structure) + '</td>';
    for (const col of cols) html += '<td>' + escapeHtml(formatRange(col.raw[r])) + '</td>';
    html += '</tr>';
  });
  wrap.innerHTML = html + '</tbody></table>';
}

// Some rows in the source data have no sub-unit or type recorded; show a
// dash so the gap reads as "not recorded" rather than as a broken cell.
function cellOrDash(value) {
  return value && value.trim()
    ? escapeHtml(value)
    : '<span class="cell-empty" title="not recorded in the source data">&mdash;</span>';
}

// The transpose: every receptor sub-type read within one brain structure.
function renderRegionTable(structure) {
  const r = DATA.structures.indexOf(structure);
  const wrap = document.getElementById('density-table');
  if (r < 0) { wrap.innerHTML = ''; return; }
  let html = '<table class="data-table"><thead><tr><th>Receptor sub-type</th>' +
    '<th>Family</th><th>Density in ' + escapeHtml(structure) + ' (fmol/mg)</th>' +
    '</tr></thead><tbody>';
  for (const col of DATA.columns) {
    const fam = familyOf(col.name);
    if (!fam) continue;
    html += '<tr><td class="name">' + escapeHtml(shortLabel(col.name, fam)) + '</td>' +
      '<td>' + escapeHtml(fam) + '</td>' +
      '<td>' + escapeHtml(formatRange(col.raw[r])) + '</td></tr>';
  }
  wrap.innerHTML = html + '</tbody></table>';
}

function renderTypesTable() {
  let html = '<table class="data-table"><thead><tr>';
  for (const h of TYPES.header) html += '<th>' + escapeHtml(h) + '</th>';
  html += '</tr></thead><tbody>';
  for (const row of TYPES.rows) {
    html += '<tr><td class="name">' + cellOrDash(row[0]) + '</td>';
    for (const cell of row.slice(1)) html += '<td>' + cellOrDash(cell) + '</td>';
    html += '</tr>';
  }
  document.getElementById('types-table').innerHTML = html + '</tbody></table>';
}

const dropdown = document.getElementById('structure-dropdown');

// The picker holds receptor families or brain structures, per the axis.
function fillDropdown() {
  const items = axisMode === 'region' ? DATA.structures : RECEPTORS;
  dropdown.innerHTML = '';
  for (const item of items) {
    const option = document.createElement('option');
    option.value = item;
    option.textContent = item;
    dropdown.appendChild(option);
  }
  dropdown.value = items[0];
  dropdown.setAttribute('aria-label',
    axisMode === 'region' ? 'Brain region' : 'Receptor family');
}
dropdown.addEventListener('change', () => { redraw(); renderDensityTable(); });

const axisGroup = document.getElementById('axis-group');
axisGroup.querySelectorAll('[data-axis]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (axisMode === btn.dataset.axis) return;
    axisGroup.querySelectorAll('[data-axis]').forEach(b =>
      b.classList.toggle('active', b === btn));
    axisMode = btn.dataset.axis;
    fillDropdown();
    redraw();
    renderDensityTable();
  });
});

// Chart detail: one bar per sub-type, or a single summed total per structure.
const modeGroup = document.getElementById('mode-group');
modeGroup.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    modeGroup.querySelectorAll('[data-mode]').forEach(b =>
      b.classList.toggle('active', b === btn));
    chartMode = btn.dataset.mode;
    redraw();
  });
});

// Sub-tab switching: Chart | Density Table | Receptor Types.
// The receptor dropdown applies to the chart and the density table; the types
// table is a fixed reference, and the detail buttons only govern the chart.
const panes = {
  chart: document.getElementById('chart-pane'),
  density: document.getElementById('density-table'),
  types: document.getElementById('types-table')
};
document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-tab]').forEach(b =>
      b.classList.toggle('active', b === btn));
    const tab = btn.dataset.tab;
    for (const [name, pane] of Object.entries(panes))
      pane.classList.toggle('hidden', name !== tab);
    dropdown.parentElement.classList.toggle('hidden', tab === 'types');
    axisGroup.classList.toggle('hidden', tab === 'types');
    modeGroup.classList.toggle('hidden', tab !== 'chart');
    if (tab === 'chart') renderChart(currentChart);
  });
});

fillDropdown();
redraw();
renderDensityTable();
renderTypesTable();

// Theme toggle — same behavior and storage key as the Region Atlas page,
// so the choice follows the visitor across pages.
const themeBtn = document.getElementById('themeBtn');
const themeLbl = document.getElementById('themeLbl');
if (document.documentElement.getAttribute('data-theme') === 'dark') {
  themeLbl.textContent = 'Light';
  themeBtn.setAttribute('aria-pressed', 'true');
}
themeBtn.addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') === 'dark';
  if (dark) { root.removeAttribute('data-theme'); themeLbl.textContent = 'Dark'; }
  else { root.setAttribute('data-theme', 'dark'); themeLbl.textContent = 'Light'; }
  themeBtn.setAttribute('aria-pressed', String(!dark));
  try { localStorage.setItem('mn-theme', dark ? 'light' : 'dark'); } catch (e) {}
});
</script>
