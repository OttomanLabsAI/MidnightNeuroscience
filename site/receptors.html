const RECEPTORS = [
  'Acetylcholine',
  'Adrenergic',
  'Cannabinoid',
  'Dopamine',
  'GABA',
  'Glutamate',
  'Histamine',
  'Melatonin',
  'Muscarinic',
  'Neuropeptide',
  'Neuropeptide Y',
  'Noradrenaline',
  'Opioid',
  'Orexin',
  'Prostaglandin',
  'Serotonin',
  'Somatostatin'
];

// Plotly's default colorway, extended so receptor families with more than
// ten subtypes (e.g. serotonin) don't repeat colors ("large" palette).
const COLORWAY = [
  '#636efa', '#EF553B', '#00cc96', '#ab63fa', '#FFA15A',
  '#19d3f3', '#FF6692', '#B6E880', '#FF97FF', '#FECB52',
  '#AA0DFE', '#3283FE', '#85660D', '#782AB6', '#565656',
  '#1C8356', '#16FF32', '#F7E1A0', '#E2E2E2', '#1CBE4F',
  '#C4451C', '#DEA0FD', '#FE00FA', '#325A9B'
];

// Mirror of BrainMapping.ReceptorFilter: keep the columns whose name
// contains the receptor keyword (case-insensitive).
function receptorFilter(receptor) {
  const keyword = receptor.toLowerCase();
  return DATA.columns.filter(col => col.name.toLowerCase().includes(keyword));
}

// Mirror of graph_index_columns(df, barmode='group', chart_type='bar').
function updateGraph(receptor) {
  const traces = receptorFilter(receptor).map((col, i) => ({
    type: 'bar',
    name: col.name,
    x: DATA.structures,
    y: col.values,
    marker: { color: COLORWAY[i % COLORWAY.length] }
  }));

  Plotly.react('receptor-graph', traces, { barmode: 'group' }, { responsive: true });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Display a 'min:max' range with an en dash; single values pass through.
function formatRange(raw) {
  const m = /^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/.exec(raw);
  return m ? m[1] + '–' + m[2] : raw;
}

// The density data as a table: brain structures down, sub-types across,
// showing the original min:max ranges from the source data.
function renderDensityTable(receptor) {
  const cols = receptorFilter(receptor);
  const wrap = document.getElementById('density-table');
  if (!cols.length) {
    wrap.innerHTML = '<p class="table-note">No receptor sub-type data for ' +
      escapeHtml(receptor) + '.</p>';
    return;
  }
  let html = '<table class="data-table"><thead><tr><th>Brain Structure</th>';
  for (const col of cols) html += '<th>' + escapeHtml(col.name) + '</th>';
  html += '</tr></thead><tbody>';
  DATA.structures.forEach((structure, r) => {
    html += '<tr><td class="name">' + escapeHtml(structure) + '</td>';
    for (const col of cols) html += '<td>' + escapeHtml(formatRange(col.raw[r])) + '</td>';
    html += '</tr>';
  });
  wrap.innerHTML = html + '</tbody></table>';
}

function renderTypesTable() {
  let html = '<table class="data-table"><thead><tr>';
  for (const h of TYPES.header) html += '<th>' + escapeHtml(h) + '</th>';
  html += '</tr></thead><tbody>';
  for (const row of TYPES.rows) {
    html += '<tr><td class="name">' + escapeHtml(row[0]) + '</td>';
    for (const cell of row.slice(1)) html += '<td>' + escapeHtml(cell) + '</td>';
    html += '</tr>';
  }
  document.getElementById('types-table').innerHTML = html + '</tbody></table>';
}

const dropdown = document.getElementById('structure-dropdown');
for (const receptor of RECEPTORS) {
  const option = document.createElement('option');
  option.value = receptor;
  option.textContent = receptor;
  dropdown.appendChild(option);
}
dropdown.value = RECEPTORS[0]; // Default value, as in the Dash app
dropdown.addEventListener('change', () => {
  updateGraph(dropdown.value);
  renderDensityTable(dropdown.value);
});

// Sub-tab switching: Chart | Density Table | Receptor Types.
// The receptor dropdown applies to the chart and the density table;
// the types table is a fixed reference, so the dropdown hides there.
const panes = {
  chart: document.getElementById('receptor-graph'),
  density: document.getElementById('density-table'),
  types: document.getElementById('types-table')
};
document.querySelectorAll('.sub-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sub-btn').forEach(b =>
      b.classList.toggle('active', b === btn));
    const tab = btn.dataset.tab;
    for (const [name, pane] of Object.entries(panes))
      pane.classList.toggle('hidden', name !== tab);
    dropdown.classList.toggle('hidden', tab === 'types');
    if (tab === 'chart') Plotly.Plots.resize(panes.chart);
  });
});

updateGraph(dropdown.value);
renderDensityTable(dropdown.value);
renderTypesTable();
</script>
